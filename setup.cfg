[metadata]
name = hiandbye
version = 0.1.0
description = Keyword-driven voice automation listener for macOS and beyond
long_description = file: README.md
long_description_content_type = text/markdown
author = hiandbye contributors
license = MIT

[options]
py_modules = keyword_listener, actions
install_requires =
    openai>=1.10.0
    SpeechRecognition>=3.10.0
    PyAudio>=0.2.14
    pocketsphinx>=5.0.0
    requests>=2.31.0
    PyYAML>=6.0.0
python_requires = >=3.10

[options.entry_points]
console_scripts =
    hiandbye = keyword_listener:main
